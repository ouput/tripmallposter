<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TripMALL 商品海报生成器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
body{font-family:"Microsoft YaHei",sans-serif;background:#f4f4f4;margin:0}
.wrap{max-width:1320px;margin:20px auto;display:flex;gap:20px;padding:20px}
.left{flex:0 0 400px;background:#fff;border-radius:10px;padding:20px}
.right{flex:1;background:#fff;border-radius:10px;padding:20px;overflow:auto}
h1{font-size:19px;margin:0 0 6px}
.hint{font-size:12px;color:#888;line-height:1.5}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:13px}
textarea,input[type=text]{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:12px}
textarea{height:200px;font-family:monospace;font-size:11px}
button{background:#e08a00;color:#fff;border:0;padding:9px 16px;border-radius:6px;font-size:14px;cursor:pointer;margin:10px 6px 0 0}
button.gr{background:#5a8}
.mode{display:flex;gap:8px;margin:8px 0}.mode button{background:#eee;color:#333;margin:0}.mode button.on{background:#e08a00;color:#fff}
.edit-row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.edit-row .eid{font-weight:700;font-size:12px;color:#666;min-width:50px}
.edit-row input{flex:1;min-width:70px;padding:5px 7px;border:1px solid #ddd;border-radius:5px;font-size:12px}
.edit-row input.en{flex:2.2;min-width:130px}
.edithint{font-size:11px;color:#999;margin:4px 0 2px}
.hist-row{display:flex;gap:6px;align-items:center;font-size:12px;margin:4px 0;flex-wrap:wrap;border-bottom:1px dashed #eee;padding-bottom:3px}
.hist-row .hf{color:#888;min-width:36px}
.hist-row .hv{color:#c05a00;font-weight:700;flex:1}
.hist-row .ht{color:#aaa;font-size:10px}
.hist-row button{margin:0;padding:2px 8px;font-size:12px;background:#5a8;color:#fff;border:0;border-radius:5px;cursor:pointer}

/* ===== 数据更新 ===== */
.upd-wrap{border:1px solid #eee;border-radius:8px;padding:10px;margin-top:10px;background:#fafafa}
.upd-time{font-size:12px;color:#666;line-height:1.6}
.upd-time b{color:#c05a00}
.upd-report{font-size:12px;color:#444;margin-top:6px;line-height:1.6}
.upd-report b.up{color:#c00}.upd-report b.down{color:#2a8}
.pbar{height:10px;background:#eee;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e08a00,#f0b46b);transition:width .3s}
.upd-msg{font-size:12px;color:#555;line-height:1.5}
.upd-detail{font-size:12px;color:#888;margin-top:2px}
.upd-banner{display:none;background:#fff8ec;border:1px solid #f0c987;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#8a5a00;line-height:1.7}
.upd-banner b.up{color:#c00}.upd-banner b.down{color:#2a8}
.upd-banner button{background:#e08a00;color:#fff;border:0;border-radius:6px;padding:5px 12px;font-size:13px;margin-left:8px;cursor:pointer}

/* ===== 采购清单模式（A4 竖版 1240×1754，导出 ×2 = 2480×3508 @300dpi） ===== */
/* 配色皮肤：默认携程蓝，可切红/绿/金/黑白 */
/* 原版（默认，与旧版采购清单一模一样） */
.lpages{display:flex;flex-direction:column;gap:18px;align-items:flex-start;
  --th-bg:#e8f2e0;--th-fg:#222;--thbd:#333;--zebra:transparent;--accent:#c00;--bigbg:#f7faf4;--smallbg:#fbfdf9;--hb:#333}
.lpages.th-orig{--th-bg:#e8f2e0;--th-fg:#222;--thbd:#333;--zebra:transparent;--accent:#c00;--bigbg:#f7faf4;--smallbg:#fbfdf9;--hb:#333}
.lpages.th-blue{--th-bg:#0A6FD6;--th-fg:#fff;--thbd:#0A6FD6;--zebra:#F5F9FF;--accent:#0A6FD6;--bigbg:#EAF3FD;--smallbg:#F8FBFF;--hb:#c9dff5}
.lpages.th-red{--th-bg:#B0202A;--th-fg:#fff;--thbd:#B0202A;--zebra:#FDF6F6;--accent:#B0202A;--bigbg:#FBECEC;--smallbg:#FEF8F8;--hb:#f0cdcd}
.lpages.th-green{--th-bg:#13715A;--th-fg:#fff;--thbd:#13715A;--zebra:#F3FAF7;--accent:#13715A;--bigbg:#E9F5F1;--smallbg:#F7FCFA;--hb:#c8e3da}
.lpages.th-gold{--th-bg:#1F1F1F;--th-fg:#F0D48A;--thbd:#1F1F1F;--zebra:#FAF8F2;--accent:#A9800B;--bigbg:#F7F3E8;--smallbg:#FCFAF4;--hb:#e2d7bb}
.lpages.th-mono{--th-bg:#F0F0F0;--th-fg:#222;--thbd:#333;--zebra:#FAFAFA;--accent:#333;--bigbg:#F6F6F6;--smallbg:#FCFCFC;--hb:#cfcfcf}
.lcard{width:1240px;height:1754px;background:#fff;box-sizing:border-box;padding:20px 18px 14px;position:relative;box-shadow:0 2px 12px rgba(0,0,0,.18);overflow:hidden}
.ltitle{font-family:"Microsoft YaHei",sans-serif;font-size:56px;font-weight:900;text-align:center;color:#111;letter-spacing:4px;line-height:1.1;
  padding:14px 0 0;background:none;border:0}
.lsub{font-size:15px;text-align:center;color:#888;font-weight:400;letter-spacing:.5px;margin-top:8px;padding:0;background:none}
.ltable{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:8px;font-family:"Microsoft YaHei",sans-serif}
.ltable th,.ltable td{border:1px solid var(--hb);padding:2px 3px;vertical-align:middle;word-break:break-all}
.ltable td{height:72px}
.ltable th{background:var(--th-bg);color:var(--th-fg);font-size:15px;font-weight:700;text-align:center;line-height:1.15;border-color:var(--thbd)}
.ltable tbody tr:nth-child(even) > td:not(.lbig):not(.lsmall):not(.lblank){background:var(--zebra)}
.ltable td{font-size:13.5px;line-height:1.3;color:#222}
.lno{text-align:center;font-size:13.5px}
.lbig{text-align:center;font-weight:700;font-size:15px;background:var(--bigbg)}
.lsmall{text-align:center;font-weight:700;font-size:14.5px;background:var(--smallbg)}
.lcode{text-align:center;font-size:12.5px}
.lprice{font-size:14px}
.lstd{line-height:1.3}
.lname{font-size:15px;font-weight:700;line-height:1.22;color:#111}
.lpar{font-size:13px;color:#444;line-height:1.3;margin-top:2px}
.limg{text-align:center;padding:0}
.limg img{max-width:100%;max-height:64px;object-fit:contain;display:block;margin:0 auto}
.lc{text-align:center}
.lprice{text-align:center;color:var(--accent);font-weight:700}
.lblank{background:#fcfcfc}
.lsup{font-size:12.5px;color:#555}
.ltier{font-size:12.5px}
.lfoot{position:absolute;left:18px;right:18px;bottom:8px;display:flex;justify-content:space-between;font-size:11px;color:#888}

/* ===== 采购清单 · 小红书 3:4 版（1080×1440，导出 ×2 = 2160×2880） ===== */
.lcard.s34{width:1080px;height:1440px;padding:16px 14px 12px}
.lcard.s34 .ltitle{font-size:50px;letter-spacing:3px;padding:12px 0 0}
.lcard.s34 .lsub{font-size:13.5px;margin-top:7px;padding:0}
.lcard.s34 .ltable{margin-top:6px}
.lcard.s34 .ltable th{font-size:14px}
.lcard.s34 .ltable td{font-size:14px;height:84px;line-height:1.32}
.lcard.s34 .lno{font-size:13.5px}
.lcard.s34 .lbig{font-size:15px}
.lcard.s34 .lsmall{font-size:14.5px}
.lcard.s34 .lcode{font-size:12.5px}
.lcard.s34 .lprice{font-size:15px}
.lcard.s34 .lname{font-size:15.5px}
.lcard.s34 .lpar{font-size:13px}
.lcard.s34 .limg img{max-height:68px}
.lcard.s34 .lfoot{left:14px;right:14px;font-size:10.5px}

/* ========== 白底模板 ========== */
.mcard{width:740px;background:#fff;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.mheadimg{width:100%;display:block}
.mtrust{display:flex;justify-content:center;gap:28px;background:#fff7ef;padding:8px 0;font-size:14px;color:#e08a00}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px 28px}
.mprod{border:1px solid #f0f0f0;border-radius:6px;overflow:hidden}
.mimg{height:250px;background:#f6f6f6;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px;overflow:hidden}
.mimg img{width:100%;height:100%;object-fit:contain}
.mpid{font-size:12px;color:#999;margin:9px 13px 0}.mname{font-size:18px;font-weight:800;color:#222;margin:3px 13px 7px}
.mprice{font-size:15px;color:#e4393c;margin:0 13px}.mprice b{font-size:25px;font-weight:800}
.mtags{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px 15px}.mtags span{border:1px solid #f0b46b;color:#c07d00;border-radius:3px;padding:2px 9px;font-size:12px}
.mfoot{background:#fafaf8;padding:14px 28px;display:flex;justify-content:space-between;align-items:flex-start;border-top:1px solid #eee}
.mfoot .f1{font-weight:800;color:#e08a00;font-size:16px}.mfoot .f2{font-size:12px;color:#444;margin:5px 0}.mfoot .f3{font-size:12px;color:#888}
.mfoot .qr{width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mfoot .qr img{width:86px;height:86px;display:block}.mfoot .qr .cap{font-size:10px;color:#aaa;margin-top:2px}
.msingle .mimg{height:440px}.msingle .mpid{font-size:14px}.msingle .mname{font-size:32px}.msingle .mprice b{font-size:42px}.msingle .mtags span{font-size:13px}

/* ========== 红色大促模板（参考图底图 + 4 个动态商品卡） ========== */
.rcard{width:540px;height:960px;margin:0 auto;position:relative;overflow:hidden;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);background:url('red_bg.png') center/100% 100% no-repeat}
.rprod{position:absolute;background:#fff;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.rpimg{flex:1;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:10px;overflow:hidden;padding:2px}
.rpimg img{width:100%;height:100%;object-fit:contain}
.rb-id{font-size:8px;color:#999;margin:5px 10px 0}
.rb-name{font-size:12px;font-weight:800;color:#222;margin:1px 10px 4px;line-height:1.25;max-height:30px;overflow:hidden}
.rb-price{color:#e4393c;font-size:9px;margin:0 10px 4px;font-weight:600}
.rb-price b{font-size:19px;font-weight:900}
.rb-tags{display:flex;flex-wrap:wrap;gap:3px;padding:0 10px 10px}
.rb-tags span{background:#fdecda;color:#b56b00;border:1px solid #f4d19b;border-radius:8px;padding:2px 7px;font-size:9px}
.rprod.big{border-radius:12px}
.rprod.big .rpimg{flex:1}
.rprod.big .rb-id{font-size:13px;color:#999;margin:10px 20px 2px}
.rprod.big .rb-name{font-size:20px;font-weight:800;color:#222;margin:0 20px 7px;line-height:1.3;max-height:56px;overflow:hidden}
.rprod.big .rb-price{font-size:14px;margin:0 20px 9px}
.rprod.big .rb-price b{font-size:33px;font-weight:900}
.rprod.big .rb-tags{padding:0 20px 22px;gap:5px}
.rprod.big .rb-tags span{font-size:14px;padding:3px 12px;border-radius:9px}
.rqr{position:absolute;left:453px;top:882px;width:56px;height:56px;background:#fff;border-radius:6px;padding:3px;box-sizing:border-box;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.rqr img{width:100%;height:100%;object-fit:contain}

/* ========== 金色推荐模板（参考图底图 + 4 个动态商品卡） ========== */
.gcard{width:707px;height:1363px;margin:0 auto;position:relative;overflow:hidden;border-radius:8px;box-shadow:0 3px 16px rgba(0,0,0,.3);background:url('gold_bg.png') center/100% 100% no-repeat}
.gprod{position:absolute;background:#fff;border:1px solid #bfb7ac;border-radius:6px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column}
.gimg{height:264px;flex:0 0 264px;padding:5px 5px 0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #d5cec4;overflow:hidden}
.gimg img{max-width:100%;max-height:100%;object-fit:contain}
.gbody{flex:1;min-height:0;padding:10px 10px 13px;box-sizing:border-box;display:flex;flex-direction:column}
.gid{font-size:10px;color:#9a9a9a;line-height:1;flex:0 0 auto}
.gname{font-size:15px;font-weight:700;color:#3d3833;margin-top:3px;line-height:1.12;flex:1 1 auto;min-height:0;overflow:hidden}
.gprice{display:flex;align-items:baseline;line-height:1;color:#e4393c;flex:0 0 auto}
.gprice .gy{font-size:22px;font-weight:600;letter-spacing:-1px}
.gprice b{font-size:23px;font-weight:800;letter-spacing:-0.5px}
.gprice .gu{font-size:11.5px;font-weight:600;margin-left:2px}
.gtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;flex:0 0 auto}
.gtags span{background:#fde6d9;color:#ef9143;border-radius:4px;padding:2px 7px;font-size:10.5px;line-height:1.2}
.gpanel{position:absolute;left:561px;top:401px;width:116px;height:149px}
.gpanel img{width:100%;height:100%;display:block}
.gqr{position:absolute;left:580px;top:461px;width:75px;height:75px}
.gqr img{width:100%;height:100%;object-fit:contain;display:block}
.gsingle .gimg{height:auto;flex:1 1 auto;padding:10px 10px 0}
.gsingle .gbody{flex:0 0 auto;padding:20px 22px 22px}
.gsingle .gid{font-size:14px}
.gsingle .gname{font-size:25px;margin-top:8px;line-height:1.18;flex:0 0 auto;max-height:74px}
.gsingle .gprice{margin-top:14px}
.gsingle .gprice .gy{font-size:34px}
.gsingle .gprice b{font-size:44px}
.gsingle .gprice .gu{font-size:20px}
.gsingle .gtags{margin-top:14px;gap:8px}
.gsingle .gtags span{font-size:15px;padding:5px 13px}


/* ========== 表格模式（品名/图片/规格/产品标准/价格，行数不限） ========== */
.tcard{width:1180px;margin:0 auto;background:#fff;padding:16px;box-sizing:border-box;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.ttable{width:100%;border-collapse:collapse;table-layout:fixed;font-family:"Microsoft YaHei",sans-serif}
.ttable th,.ttable td{border:1px solid #000;padding:6px 8px;vertical-align:middle}
.ttable th{font-size:20px;font-weight:800;color:#111;text-align:center;height:54px}
.ttable td{font-size:13px;color:#222}
.tcat{font-size:18px;font-weight:800;text-align:center;line-height:1.35}
.timg{text-align:center;padding:6px}
.timg img{max-width:150px;max-height:120px;object-fit:contain;display:block;margin:0 auto}
.tspec{font-size:14px;font-weight:700;line-height:1.45}
.tstd{font-size:13px;line-height:1.7;text-align:justify}
.tstd i{font-style:normal;margin-right:6px}
.tprice{text-align:center;color:#e4393c;font-weight:800;font-size:19px;white-space:nowrap}
.ttip{font-size:12px;color:#999;text-align:center;padding:6px 0 0}


/* ========== 水印层（斜向「携程服务市场 TripMALL」，可开关） ========== */
.wm{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:99}
.wm i{position:absolute;font-family:"Microsoft YaHei",sans-serif;font-weight:700;font-size:26px;letter-spacing:2px;color:rgba(60,40,10,.085);white-space:nowrap;transform:rotate(-26deg);transform-origin:left top}
.mcard{position:relative}
.tcard{position:relative}


</style>
</head>
<body>
<div class="wrap">
<div class="left"><h1>TripMALL 商品海报生成器</h1>
<p class="hint" id="hint">每行一个商品ID（空格/换行分隔）。从后台商品库取名称/价格/主图/多标签，按所选模板出图。</p>
<label>海报模板</label>
<div class="mode"><button class="on" id="tb-white" onclick="setTpl('white')">白底模板</button><button id="tb-red" onclick="setTpl('red')">红色大促</button><button id="tb-gold" onclick="setTpl('gold')">金色推荐</button><button id="tb-table" onclick="setTpl('table')">表格模式</button><button id="tb-list" onclick="setTpl('list')">采购清单</button></div>
<div id="listSize" style="display:none">
  <div id="listTplRow">
    <label>清单类型</label>
    <div class="mode"><button class="on" id="lt-detail" onclick="setListTpl('detail')">明细版</button><button id="lt-brief" onclick="setListTpl('brief')">精简版</button><button id="lt-compare" onclick="setListTpl('compare')">比价版</button></div>
  </div>
  <label>清单尺寸</label>
  <div class="mode"><button class="on" id="ls-a4" onclick="setListSize('a4')">A4 竖版</button><button id="ls-s34" onclick="setListSize('s34')">小红书 3:4</button></div>
  <label>表格配色</label>
  <div class="mode"><button class="on" id="thm-orig" onclick="setListTheme('orig')">原版</button><button id="thm-blue" onclick="setListTheme('blue')">蓝</button><button id="thm-red" onclick="setListTheme('red')">红</button><button id="thm-green" onclick="setListTheme('green')">绿</button><button id="thm-gold" onclick="setListTheme('gold')">金</button><button id="thm-mono" onclick="setListTheme('mono')">黑白</button></div>
</div>
<label>版式</label>
<div class="mode"><button class="on" id="mb-grid" onclick="setMode('grid')">4商品拼版</button><button id="mb-single" onclick="setMode('single')">单商品竖版</button></div>
<label style="display:flex;align-items:center;gap:6px;font-weight:400;cursor:pointer"><input type="checkbox" id="wmOn" style="width:auto;margin:0" onchange="WM=this.checked;gen()"> 添加水印（斜向「携程服务市场 TripMALL」）</label>
<textarea id="ids">6517
69047
67461
67327</textarea>
<label>页脚第二行（优惠话术）</label><input id="foot1" value="新客20元无门槛优惠券 叠加海量店铺优惠券">
<label>页脚第三行（购买路径）</label><input id="foot2" value="电脑端：携程EBooking->商机中心->服务市场；APP端：携程EBooking->用品采购">
<label>商品信息（可编辑价格/单位/标签）</label>
<div class="edithint">标签用逗号分隔，如：经济实惠,客房标配</div>
<div id="editArea"></div>
<div id="listPanel" style="display:none"></div>
<button style="margin-top:6px;background:#5a8" onclick="saveSnap()">保存本轮编辑</button><button style="margin-top:6px;margin-left:4px" onclick="renderHistory()">查看保存记录</button>
<div id="histArea"></div>
<div class="upd-wrap">
  <div class="upd-time" id="updTime">数据更新时间：加载中…</div>
  <div class="upd-report" id="updReport"></div>
  <button style="margin-top:8px" onclick="checkUpdate()">检查更新</button>
  <button style="margin-top:8px;margin-left:4px;background:#5a8" onclick="reloadData()">刷新数据</button>
  <div id="updPanel" style="display:none;margin-top:8px">
    <div class="pbar"><i id="pbarI"></i></div>
    <div class="upd-msg" id="updMsg"></div>
    <div class="upd-detail" id="updDetail"></div>
  </div>
</div>
<button onclick="gen()">生成</button><button class="gr" onclick="exportPng()">导出 PNG</button>
</div>
<div class="right"><div class="upd-banner" id="updBanner"></div><div id="preview"></div></div>
</div>
<div id="cardBox" hidden></div>
<script>
let mode='grid', tpl='white', DATA={}, SPECS={}, edits={}, idsKey='', WM=false;
function wmHTML(w,h){
  const text='携程服务市场 TripMALL', stepX=330, stepY=190;
  let out='';
  for(let y=-140;y<h+160;y+=stepY){
    for(let x=-180;x<w+240;x+=stepX){
      out+='<i style="left:'+x+'px;top:'+y+'px">'+text+'</i>';
    }
  }
  return '<div class="wm">'+out+'</div>';
}
try{ edits=JSON.parse(localStorage.getItem('tme_edits')||'{}'); }catch(e){ edits={}; }
function saveEdits(){ try{ localStorage.setItem('tme_edits', JSON.stringify(edits)); }catch(e){} }
function saveSnap(){ try{ const ids=document.getElementById('ids').value.trim().split(/\s+/).filter(Boolean); const snap={t:Date.now(), ids, edits:JSON.parse(JSON.stringify(edits))}; const s=JSON.parse(localStorage.getItem('tme_saved')||'[]'); s.unshift(snap); localStorage.setItem('tme_saved', JSON.stringify(s.slice(0,30))); renderHistory(); alert('已保存本轮编辑'); }catch(e){} }

async function pollProgress(){
  var msg=document.getElementById('updMsg'), det=document.getElementById('updDetail'), bar=document.getElementById('pbarI');
  try{
    var r=await fetch('http://127.0.0.1:8790/?t='+Date.now(),{cache:'no-store'});
    var j=await r.json();
    var pct=j.total?Math.round(j.done/j.total*100):0;
    if(bar) bar.style.width=pct+'%';
    if(msg) msg.innerText=j.message||'';
    if(det) det.innerText='进度 '+j.done+' / '+j.total+'（'+pct+'%）';
    if(j.state==='done'){
      if(updTimer){clearInterval(updTimer);updTimer=null;}
      if(det) det.innerHTML='进度 '+j.done+' / '+j.total+'（'+pct+'%）<br><b style="color:#2a8">更新完成，点「刷新数据」即可用最新数据</b>';
      loadMeta();
    }
    if(j.state==='error'){
      if(updTimer){clearInterval(updTimer);updTimer=null;}
      if(det) det.innerHTML='<b style="color:#c00">'+esc(j.message||'出错')+'</b>';
    }
  }catch(e){
    if(msg) msg.innerHTML='未检测到本机更新程序。请双击电脑上的 <b>检查更新.bat</b>，本页会自动显示进度。';

  }
}

var UNIT_WORDS=['件','个','只','支','条','套','瓶','包','袋','盒','箱','桶','张','台','把','块','片','组','份','卷','米','公斤','对','副','听','罐','床','捆','扎','双','顶','扇','盏','匹','部','艘','辆','间','位','次','天','平方','平方米','码','磅'];
function normUnit(v){
  var s=String(v==null?'':v).trim();
  if(!s) return '';
  if(UNIT_WORDS.indexOf(s)>=0) return s;
  var m1=s.match(/\/([\u4e00-\u9fa5]{1,2})$/);           // 1000/箱
  if(m1&&UNIT_WORDS.indexOf(m1[1])>=0) return m1[1];
  var m2=s.match(/^([\u4e00-\u9fa5]{1,2})\//);            // 个/箱
  if(m2&&UNIT_WORDS.indexOf(m2[1])>=0) return m2[1];
  var m3=s.match(/^([\u4e00-\u9fa5]{1,2})\s*装?$/);       // 箱装 / 桶装
  if(m3&&UNIT_WORDS.indexOf(m3[1])>=0) return m3[1];
  return '';
}
function scrapedUnit(id){
  var sp=SPECS[String(id)];
  if(!sp||!sp.p||!sp.p.length) return '';
  for(var i=0;i<sp.p.length;i++){
    if(/箱规|计量单位|规格单位|销售单位|单位/.test(sp.p[i][0])){
      var u=normUnit(sp.p[i][1]);
      if(u) return u;
    }
  }
  return '';
}
function unitOf(id, name, e){
  if(e && e.unit!=null && e.unit!=='') return e.unit;      // 1) 手动编辑优先
  var su=scrapedUnit(id);
  if(su) return su;                                        // 2) 详情页抓到的单位
  return guessUnit(name)||'件';                            // 3) 名称关键词推断
}
function guessUnit(name){
  const n=name||'';
  const r=(re)=>re.test(n);
  if(r(/箱|整箱|箱装|件\/箱|瓶\/箱|支\/箱|24瓶|12瓶|24听|12听/)) return '箱';
  if(r(/矿泉水|饮用水|纯净水|山泉水|天然水|苏打水|气泡水/)) return '箱';
  if(r(/洗发|洗手|沐浴|洗沐|洗衣液|洗洁|消毒液|洁厕|护发|护理液|漱口|清洁剂|酒精|精油|洗发水|洗手液|沐浴露/)) return '瓶';
  if(r(/套装|六件套|五件套|四件套|洗漱|牙具|护理包|旅行套装|床品四件/)) return '套';
  if(r(/茶包|袋泡茶|抽纸|卷纸|湿巾|面巾纸|擦手纸|纸巾/)) return '包';
  if(r(/吹风机|电水壶|电视机|冰箱|空调|洗衣机|加湿器|热水器|咖啡机|茶饮机|打印机|投影仪|扫地机|电风扇|电暖器|挂烫机|体重秤|灭蚊器|熨斗/)) return '台';
  if(r(/毛巾|浴巾|方巾|地巾|床单|被套|枕套|夏被|毛毯|浴袍|浴衣/)) return '条';
  if(r(/床垫|床褥/)) return '张';
  if(r(/拖鞋|凉拖|布拖/)) return '双';
  if(r(/香皂|肥皂/)) return '块';
  if(r(/卷纸|空心卷纸|有芯卷纸/)) return '卷';
  if(r(/枕芯|被芯|枕头|抱枕|保护垫|咖啡杯|杯|壶|锅|碗|碟|勺|筷|垃圾桶|收纳|托盘|衣架/)) return '个';
  return '件';
}

function guessCat(pkgName, cats, prodName){
  // 优先用「服务市场三级类目」（如：大瓶洗沐 / 小支洗沐 / 枕套 / 床垫 / 拖鞋）
  const chain=cats||[];
  if(chain.length) return chain[chain.length-1];
  const src=String(pkgName||'');
  // 1) 套餐名里找关键词（最准）
  for(let i=0;i<CAT_MAP.length;i++){ if(src&&CAT_MAP[i][0].test(src)) return CAT_MAP[i][1]; }
  // 2) 商品名里找关键词
  const prod=String(prodName||'');
  for(let i=0;i<CAT_MAP.length;i++){ if(prod&&CAT_MAP[i][0].test(prod)) return CAT_MAP[i][1]; }

}
function listPaginate(groups,budget){
  var pages=[],cur=[],h=0,no=1;
  groups.forEach(function(g){
    g.cats.forEach(function(c){
      var unitH=0;
      c.picks.forEach(function(p){
        var nameLen=String(p.name||'').length;
        var parLen=listStdParams(p.props).length;
        var nl=Math.max(1,Math.min(3,Math.ceil(nameLen/28)));
        var pl=Math.max(0,Math.min(6,Math.ceil(parLen/33)));
        unitH+=Math.max(70,6+nl*16+pl*15);
      });
      if(h+unitH>budget && cur.length){ pages.push(cur); cur=[]; h=0; }
      var startNo=no;
      c.picks.forEach(function(p,i){ no++; });
      cur.push({big:g.big,cat:c.cat,picks:c.picks,startNo:startNo,unitH:unitH});
      h+=unitH;
    });
  });
  if(cur.length) pages.push(cur);
  return pages;
}
function listCards(){
  var groups=listGroupsRows();
  if(!groups.length) return '<div class="lpages"><div class="lcard"><div class="ltitle">酒店运营物资采购清单</div><div class="lsub">没有可用的商品数据（请勾选品类）</div></div></div>';
  var box=document.getElementById('cardBox');
  var prevHidden=box.hidden; box.hidden=false;   // 必须可见才能量出真实高度
  var probe=document.createElement('div');
  probe.className=listCardCls();
  probe.style.cssText='position:absolute;left:-20000px;top:0;visibility:hidden';
  probe.innerHTML='<div class="ltitle">酒店运营物资采购清单</div><div class="lsub">x</div>'+
    '<table class="ltable">'+listColgroup()+listThead()+'<tbody></tbody></table><div class="lfoot">x</div>';
  box.appendChild(probe);
  var table=probe.querySelector('.ltable'), tbody=probe.querySelector('tbody');
  var thead=probe.querySelector('thead');
  var bodyAvail=probe.clientHeight - table.offsetTop - thead.getBoundingClientRect().height - 34;
  /* 一次性把所有行按最终列结构塞进探针（合并列用 rowspan=1），只触发一次布局即可拿到每行真实高度 */
  var probeHTML='';
  groups.forEach(function(g){
    g.cats.forEach(function(c){
      var u={big:g.big,cat:c.cat,picks:c.picks};
      c.picks.forEach(function(p,i){ probeHTML+=listRowHTML(u,i,true,1,true,1); });
    });
  });
  tbody.innerHTML=probeHTML;
  var probeRows=tbody.querySelectorAll('tr'), probeIdx=0;
  groups.forEach(function(g){
    g.cats.forEach(function(c){
      c.hs=[];
      for(var i=0;i<c.picks.length;i++){
        var tr=probeRows[probeIdx++];
        c.hs.push(tr ? Math.round(tr.getBoundingClientRect().height) : 84);
      }
    });
  });
  var pages=[],cur=[],used=0,no=1;
  groups.forEach(function(g){
    g.cats.forEach(function(c){
      var u={big:g.big,cat:c.cat,picks:c.picks,startNo:no};
      var unitH=0;
      for(var i=0;i<c.hs.length;i++){ unitH+=c.hs[i]; }
      if(used+unitH>bodyAvail && cur.length){ pages.push(cur); cur=[]; used=0; }
      cur.push(u); used+=unitH; no+=c.picks.length;
    });
  });
  if(cur.length) pages.push(cur);
  probe.parentNode && probe.parentNode.removeChild(probe);
  box.hidden=prevHidden;
  var h='<div class="'+listPagesCls()+'">';
  pages.forEach(function(pg,pi){ h+=listPageHTML(pg,pi,pages.length); });
  return h+'</div>';
}
function listUI(){
  var el=document.getElementById('listPanel'); if(!el) return;
  listInitSel();
  if(el.getAttribute('data-shown')==='1'){ return; }
  el.setAttribute('data-shown','1');
  var h='<div class="edithint">勾选要放进清单的品类（每类自动挑 '+LIST_ALT+' 档备选）</div>';
  LIST_GROUPS.forEach(function(g){
    h+='<div style="margin:4px 0"><b style="font-size:12px">'+g[0]+'</b> ';
    g[1].forEach(function(c){
      h+='<label style="display:inline-block;font-size:12px;margin-right:6px;font-weight:400;cursor:pointer"><input type="checkbox" style="width:auto;margin:0 2px 0 0" '+(LIST_SEL[c]?'checked':'')+' onchange="LIST_SEL[\''+c+'\']=this.checked;gen()">'+c+'</label>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
function card(items){
  var lp=document.getElementById('listPanel');
  var sz=document.getElementById('listSize');
  var tr=document.getElementById('listTplRow');
  if(sz){ sz.style.display = (tpl==='list'||tpl==='table') ? 'block' : 'none'; syncListBtns(); }
  if(tr) tr.style.display = (tpl==='list') ? 'block' : 'none';
  if(tpl==='list'){
    if(lp) lp.style.display='block';
    listUI(); return listCards();
  }
  if(lp) lp.style.display='none';
  return tpl==='red' ? redCard(items) : (tpl==='gold' ? goldCard(items) : (tpl==='table' ? tableCard(items) : whiteCard(items)));
}
async function exportPng(){
  if(!document.getElementById('cardBox').firstElementChild) await gen();
  const box=document.getElementById('cardBox');
  const root=box.firstElementChild;
  const prev=box.hidden; box.hidden=false; // 显示以获取真实尺寸
  try{
    await new Promise(r=>setTimeout(r,80));
    const pages = (root && root.classList.contains('lpages')) ? Array.prototype.slice.call(root.querySelectorAll('.lcard')) : [root];
    if(pages.length>1 && typeof JSZip!=='undefined'){
      const zip=new JSZip();
      for(let i=0;i<pages.length;i++){
        const c=await html2canvas(pages[i],{scale:2,useCORS:true,allowTaint:false,imageTimeout:30000,backgroundColor:'#fff'});
        const blob=await new Promise(res=>c.toBlob(res,'image/png'));
        if(blob) zip.file(listDef().name+'_'+sizeTag()+'_第'+(i+1)+'页.png', blob);
      }
      const z=await zip.generateAsync({type:'blob'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(z);
      setTimeout(function(){URL.revokeObjectURL(a.href);},8000);
      a.download=listDef().name+'_'+sizeTag()+'_共'+pages.length+'页.zip';
      a.click();
      alert('已打包导出 '+pages.length+' 张 '+(LIST_SIZE==='s34'?'3:4':'A4')+' 图片（每张 '+sizePx()+'）');
      return;
    }
    for(let i=0;i<pages.length;i++){
      const c=await html2canvas(pages[i],{scale:2,useCORS:true,allowTaint:false,imageTimeout:30000,backgroundColor:'#fff'});
      const blob=await new Promise(res=>c.toBlob(res,'image/png'));
      const a=document.createElement('a');
      if(blob){ a.href=URL.createObjectURL(blob); setTimeout(function(){URL.revokeObjectURL(a.href);},6000); }
      else { a.href=c.toDataURL('image/png'); }
      a.download = pages.length>1 ? (listDef().name+'_'+sizeTag()+'_第'+(i+1)+'页.png') : 'product-card.png';
      a.click();
      if(pages.length>1) await new Promise(r=>setTimeout(r,900));
    }
    if(pages.length>1) alert('已导出 '+pages.length+' 张 '+(LIST_SIZE==='s34'?'3:4':'A4')+' 图片（每张 '+sizePx()+'）');
  } catch(e){ alert('导出失败：'+e.message); }
  finally{ box.hidden=prev; }
}
